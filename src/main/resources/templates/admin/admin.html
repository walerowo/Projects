<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
</head>
<body>

<h1>Admin Panel</h1>

<h2>All Users</h2>
<table border="1" cellspacing="0" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>First name</th>
        <th>Last name</th>
        <th>Age</th>
        <th>Username</th>
        <th>Roles</th>

    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.age}"></td>
        <td th:text="${user.username}"></td>
        <td>
            <span th:each="role : ${user.roles}" th:text="${role.roleName} + ' '"></span>
        </td>
        <td>
            <form th:action="@{/admin/edit}" method="get" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit">Edit</button>
            </form>
            <form th:action="@{/admin/delete}" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit" onclick="return confirm('Are you sure?')">Delete</button>
            </form>
            <form th:action="@{/admin/update}" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}">
                <button type="submit">Update</button>
            </form>

        </td>
    </tr>
    </tbody>
</table>

<h2>Add New User</h2>
<form th:action="@{/admin/add}" method="post" th:object="${user}">
    <label>First name:
        <input type="text" th:field="*{name}" placeholder="Name" required>
    </label><br>

    <label>Last name:
        <input type="text" th:field="*{lastName}" placeholder="Last Name" required>
    </label><br>

    <label>Age:
        <input type="number" th:field="*{age}" placeholder="Age" required>
    </label><br>

    <label>Username:
        <input type="text"  th:field="*{username}" placeholder="Username" required>
    </label><br>

    <label>Password:
        <input type="password" th:field="*{password}" placeholder="Password" required>
    </label><br>

    <label>Roles:
        <select name="rolesFromForm" multiple size="2">
            <option value="ROLE_USER" selected>ROLE_USER</option>
            <option value="ROLE_ADMIN">ROLE_ADMIN</option>
        </select>
    </label><br>

    <button type="submit">Add User</button>
</form>

<!-- ======== LOGOUT ======== -->
<form th:action="@{/logout}" method="post" style="margin-top:20px;">
    <button type="submit">Logout</button>
</form>

</body>
</html>
